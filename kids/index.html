      radial-gradient(ellipse 60% 40% at 88% 0%, var(--blob1), transparent 60%),
      radial-gradient(ellipse 50% 35% at 4% 100%, var(--blob2), transparent 60%),
      radial-gradient(ellipse 42% 30% at 50% 42%, var(--blob3), transparent 65%),
      var(--paper);
    min-height:100vh;
    color:var(--ink);
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:24px 18px 64px;
  }
  header.top{
    text-align:center;
    padding:18px 0 8px;
  }
  header.top .eyebrow{
    font-weight:700;
    font-size:13px;
    letter-spacing:.06em;
    color:var(--ink);
    background:var(--card);
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 16px 7px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  header.top .eyebrow .palette-dot{
    width:14px;height:14px;border-radius:50%;
    background:conic-gradient(var(--coral),var(--gold),var(--teal),var(--coral));
    flex:none;
  }
  header.top h1{
    font-size:clamp(24px,4.2vw,34px);
    margin:16px 0 6px;
    font-weight:700;
    text-wrap:balance;
  }
  header.top p{
    margin:0;
    color:var(--sub);
    font-size:15px;
  }

  .progress{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin:24px 0 6px;
  }
  .progress-dots{display:flex;justify-content:center;gap:9px;}
  .progress-dots .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--card);
    border:2px solid var(--line);
    transition:all .25s ease;
  }
  .progress-dots .dot.active{
    background:var(--coral);
    border-color:var(--coral);
    width:15px;height:15px;
    box-shadow:0 0 0 4px var(--coral-tint);
  }
  .progress-dots .dot.done{
    background:var(--gold);
    border-color:var(--gold);
  }
  .progress-count{
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--sub);
    font-variant-numeric:tabular-nums;
  }

  .panel{
    background:var(--card);
    border-radius:var(--radius);
    padding:28px 24px;
    margin-top:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    animation:panelIn .28s ease;
  }
  @keyframes panelIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .step-label{
    font-weight:700;
    font-size:13px;
    letter-spacing:.02em;
    color:var(--teal);
    margin-bottom:6px;
  }
  .panel h2{
    font-size:clamp(19px,3vw,24px);
    margin:0 0 6px;
    font-weight:700;
    text-wrap:balance;
  }
  .panel .hint{
    color:var(--sub);
    font-size:14px;
    margin:0 0 20px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:12px;
  }
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}

  .card-btn{
    border:2px solid var(--line);
    background:var(--card);
    border-radius:16px;
    padding:18px 14px;
    text-align:left;
    cursor:pointer;
    min-height:60px;
    font-family:inherit;
    color:var(--ink);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .card-btn .emoji{font-size:26px;}
  .card-btn .label{font-weight:700;font-size:15.5px;}
  .card-btn .desc{font-size:12.5px;color:var(--sub);line-height:1.4;}
  .card-btn:hover{border-color:var(--teal);transform:translateY(-3px) rotate(-.3deg);}
  .card-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .card-btn.selected{
    border-color:var(--teal);
    background:var(--teal-tint);
    box-shadow:0 8px 18px var(--teal-tint);
  }
  .card-btn.big{
    min-height:96px;
    justify-content:center;
    align-items:center;
    text-align:center;
  }
  .card-btn.big .emoji{font-size:34px;}
  .card-btn.big .label{font-size:17px;}

  .chip{
    border:2px solid var(--line);
    background:var(--card);
    color:var(--ink);
    border-radius:999px;
    padding:12px 18px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    min-height:52px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:inherit;
    transition:transform .12s ease, border-color .15s ease, background .15s ease, color .15s ease;
  }
  .chip:hover{border-color:var(--teal);transform:translateY(-2px);}
  .chip:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .chip.selected{
    border-color:var(--teal);
    background:var(--teal-tint);
    color:var(--teal);
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:10px;}

  .swatch{
    width:20px;height:20px;border-radius:50%;
    border:2px solid rgba(0,0,0,.12);
    display:inline-block;
  }

  input[type=text], textarea{
    width:100%;
    border:2px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-family:inherit;
    font-size:15px;
    resize:vertical;
    background:var(--card);
    color:var(--ink);
  }
  input[type=text]:focus, textarea:focus{
    outline:none;border-color:var(--teal);
  }

  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:26px;
    gap:10px;
  }
  button.btn{
    font-family:inherit;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:15px 22px;
    font-weight:700;
    font-size:15px;
    min-height:52px;
    transition:transform .1s ease, opacity .15s ease;
  }
  button.btn:active{transform:scale(.97);}
  button.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  button.btn.primary{
    background:linear-gradient(135deg,var(--coral),var(--coral-2));
    color:#fff;
    box-shadow:0 10px 20px var(--coral-tint);
  }
  button.btn.primary:disabled{
    opacity:.4;cursor:not-allowed;box-shadow:none;
  }
  button.btn.ghost{
    background:var(--card);
    color:var(--sub);
    border:2px solid var(--line);
  }
  button.btn.block{width:100%;}

  .badge-grade{
    display:inline-block;
    background:var(--gold-tint);
    color:var(--gold);
    font-weight:700;
    font-size:12.5px;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:10px;
    border:1px solid var(--gold-tint);
  }

  .prompt-box{
    background:var(--night);
    color:var(--night-ink);
    border-radius:16px;
    padding:20px;
    font-size:15px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:keep-all;
  }
  .prompt-box .line-label{color:var(--night-label);font-weight:700;}

  .result-block{margin-bottom:22px;}
  .result-block h3{
    font-size:15px;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .result-block h3 .tag{
    font-size:11px;
    background:var(--line);
    color:var(--sub);
    padding:3px 9px;
    border-radius:999px;
    font-weight:700;
  }

  .tip{
    background:var(--info-bg);
    border:1px solid var(--info-line);
    border-radius:14px;
    padding:14px 16px;
    font-size:13.5px;
    color:var(--info-ink);
    line-height:1.6;
    margin-top:6px;
  }
  .tip.tip-success{
    background:var(--success-bg);
    border-color:var(--success-line);
    color:var(--success-ink);
    margin-top:16px;
  }

  .copy-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .copied-msg{
    font-size:13px;color:var(--teal);font-weight:700;
    display:none;align-items:center;gap:4px;
  }
  .copied-msg.show{display:inline-flex;}

  footer.foot{
    text-align:center;
    color:var(--sub);
    font-size:12px;
    margin-top:34px;
  }

  @media (max-width:520px){
    .grid.cols-2{grid-template-columns:1fr;}
    .nav{flex-direction:column-reverse;}
    .nav button.btn{width:100%;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow"><span class="palette-dot"></span>CHUNGNAM AI ART LAB</span>
    <h1>🎨 AI 그림 프롬프트 만들기</h1>
    <p>내 상상을 캔바(Canva) AI가 알아듣는 말로 바꿔볼까요?</p>
  </header>

  <div class="progress" id="progress"></div>

  <main id="app"></main>

  <footer class="foot">충남소프트웨어교육체험센터 · 초등학생 AI 예술체험 프로그램</footer>
</div>

<script>
const CATEGORIES = [
  {id:'animal', emoji:'🐾', label:'동물 친구', desc:'귀엽고 신기한 동물 이야기',
    subjects:['사자','고양이','강아지','용','유니콘','판다','부엉이','여우','토끼','펭귄']},
  {id:'fantasy', emoji:'🧚', label:'상상의 세계', desc:'요정과 마법이 사는 나라',
    subjects:['요정','마법사','거인','인어','로봇 친구','구름 나라 주민','드래곤 기사','숲의 정령']},
  {id:'future', emoji:'🏙️', label:'미래 도시', desc:'멋진 기술이 가득한 내일',
    subjects:['하늘을 나는 자동차','로봇 도우미','우주 정거장','반짝이는 빌딩숲','자율주행 버스','홀로그램 광고판']},
  {id:'nature', emoji:'🌳', label:'자연과 계절', desc:'아름다운 자연의 순간',
    subjects:['벚꽃 나무','눈 내리는 숲','무지개 폭포','반딧불이 정원','가을 단풍길','여름 바다']},
  {id:'space', emoji:'🚀', label:'우주 탐험', desc:'별과 행성이 가득한 우주',
    subjects:['우주선','외계 행성','별자리','우주 비행사','토성 고리','은하수']},
  {id:'yummy', emoji:'🍰', label:'맛있는 상상', desc:'달콤하고 신나는 먹거리 나라',
    subjects:['무지개 케이크','사탕 성','아이스크림 산','초콜릿 강','과일 마을','젤리 정원']},
];

const COLORS = [
  {name:'빨강', hex:'#FF6B6B'}, {name:'주황', hex:'#FFA94D'}, {name:'노랑', hex:'#FFD93D'},
  {name:'초록', hex:'#3FC98A'}, {name:'파랑', hex:'#4D96FF'}, {name:'남색', hex:'#3B4CCA'},
  {name:'보라', hex:'#9B5DE5'}, {name:'분홍', hex:'#FF6FB5'}, {name:'하양', hex:'#FFFFFF'},
  {name:'검정', hex:'#2B2B2B'}, {name:'금색', hex:'#D4AF37'},
  {name:'무지개색', hex:'linear-gradient(135deg,#FF6B6B,#FFD93D,#3FC98A,#4D96FF,#9B5DE5)'},
];

const SHAPES = ['동글동글한','뾰족뾰족한','반짝반짝 빛나는','몽실몽실한','각진','물결치는'];
const MOODS = ['신나고 활기찬','몽환적이고 신비로운','따뜻하고 포근한','웅장하고 멋진','평화롭고 잔잔한','귀엽고 사랑스러운'];

const STEPS = ['grade','category','subject','color','shape','mood','extra','result'];

let state = {
  step:0,
  grade:null,
  category:null,
  subject:null,
  customSubject:'',
  colors:[],
  shape:null,
  mood:null,
  extra:'',
  editedPrompt:null,
};

// gongnyang-prompt-kit(github.com/gongnyang/gongnyang-prompt-kit)의 핵심 원칙을 반영:
// 장면을 구체적으로 서술하고, 색은 HEX와 함께 병기하며, '예쁘게'류의 빈 형용사 대신
// 장면·색·질감·분위기를 구조화된 문장으로 풀어써서 AI가 더 정확한 이미지를 생성하게 한다.
function colorToken(name){
  const c = COLORS.find(x=>x.name===name);
  if(!c) return name;
  if(c.hex.startsWith('linear-gradient')) return `${name}(빨강에서 보라까지 무지개 그러데이션)`;
  return `${name}(${c.hex})`;
}

function buildPrompt(){
  const subject = state.subject === '__custom__' ? (state.customSubject || '나만의 주제') : state.subject;
  const catLabel = state.category.label;
  const colorTokens = state.colors.length ? state.colors.map(colorToken).join(', ') : '장면에 자연스럽게 어울리는 색';
  const extra = state.extra.trim();

  let lines = [];
  lines.push(`장면: ${subject} 하나를 화면 가운데에 크게 그리고, 배경은 '${catLabel}' 세계관에 어울리는 요소로 자연스럽게 채워주세요.`);
  if(extra) lines.push(`이야기: ${extra}`);
  lines.push(`색: ${colorTokens} 색을 중심으로 사용해주세요.`);
  lines.push(`질감·형태: ${subject}의 표면과 윤곽을 '${state.shape}' 형태로 표현해주세요.`);
  lines.push(`빛과 분위기: 빛의 방향과 색감을 조절해서 '${state.mood}' 느낌이 잘 드러나게 그려주세요.`);
  lines.push(`글자: 그림 안에는 글자나 문구를 넣지 않습니다.`);
  lines.push(`비율: 정사각형(AR 1:1)`);
  return lines.join('\n');
}

function formatPromptHTML(text){
  return text.split('\n').map(line=>{
    const idx = line.indexOf(':');
    if(idx>-1 && idx<=8){
      return `<span class="line-label">${escapeHtml(line.slice(0,idx))}:</span>${escapeHtml(line.slice(idx+1))}`;
    }
    return escapeHtml(line);
  }).join('\n');
}

function setState(patch){
  state = Object.assign({}, state, patch);
  render();
}

function goNext(){ setState({step: Math.min(state.step+1, STEPS.length-1)}); window.scrollTo({top:0,behavior:'smooth'}); }
function goBack(){ setState({step: Math.max(state.step-1, 0)}); window.scrollTo({top:0,behavior:'smooth'}); }
function goRestart(){
  state = {step:0, grade:null, category:null, subject:null, customSubject:'', colors:[], shape:null, mood:null, extra:'', editedPrompt:null};
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderProgress(){
  const el = document.getElementById('progress');
  if(STEPS[state.step] === 'result'){ el.innerHTML=''; return; }
  const total = STEPS.length - 1; // exclude result
  const dots = STEPS.slice(0,total).map((s,i)=>{
    let cls = 'dot';
    if(i === state.step) cls += ' active';
    else if(i < state.step) cls += ' done';
    return `<span class="${cls}"></span>`;
  }).join('');
  el.innerHTML = `<div class="progress-dots">${dots}</div><div class="progress-count">STEP ${state.step+1} / ${total}</div>`;
}

function panel(inner){
  return `<div class="panel">${inner}</div>`;
}

function navHTML(nextDisabled, nextLabel){
  return `
  <div class="nav">
    ${state.step>0 ? `<button class="btn ghost" onclick="goBack()">← 이전</button>` : `<span></span>`}
    <button class="btn primary" ${nextDisabled?'disabled':''} onclick="goNext()">${nextLabel||'다음 →'}</button>
  </div>`;
}

function renderGrade(){
  return panel(`
    <div class="step-label">STEP 1 · 학년 선택</div>
    <h2>몇 학년인가요?</h2>
    <p class="hint">학년에 따라 마지막에 프롬프트를 사용하는 방법이 조금 달라져요.</p>
    <div class="grid cols-2">
      <button class="card-btn big ${state.grade==='5'?'selected':''}" onclick="setState({grade:'5'})">
        <div class="emoji">5️⃣</div><div class="label">5학년</div>
        <div class="desc">완성된 프롬프트를 그대로 사용해요</div>
      </button>
      <button class="card-btn big ${state.grade==='6'?'selected':''}" onclick="setState({grade:'6'})">
        <div class="emoji">6️⃣</div><div class="label">6학년</div>
        <div class="desc">완성된 프롬프트를 내 말로 바꿔봐요</div>
      </button>
    </div>
    ${navHTML(!state.grade)}
  `);
}

function renderCategory(){
  return panel(`
    <div class="step-label">STEP 2 · 주제 정하기</div>
    <h2>무엇을 그리고 싶나요?</h2>
    <p class="hint">마음에 드는 주제를 하나 골라보세요.</p>
    <div class="grid">
      ${CATEGORIES.map(c=>`
        <button class="card-btn ${state.category && state.category.id===c.id?'selected':''}"
          onclick='chooseCategory("${c.id}")'>
          <div class="emoji">${c.emoji}</div>
          <div class="label">${c.label}</div>
          <div class="desc">${c.desc}</div>
        </button>
      `).join('')}
    </div>
    ${navHTML(!state.category)}
  `);
}
function chooseCategory(id){
  const cat = CATEGORIES.find(c=>c.id===id);
  setState({category:cat, subject:null, customSubject:''});
}

function renderSubject(){
  const cat = state.category;
  return panel(`
    <div class="step-label">STEP 3 · 소재 정하기</div>
    <h2>${cat.emoji} ${cat.label} 중에서 무엇을 그릴까요?</h2>
    <p class="hint">목록에서 골라도 되고, 원하는 걸 직접 써도 좋아요.</p>
    <div class="chip-row">
      ${cat.subjects.map(s=>`
        <button class="chip ${state.subject===s?'selected':''}" onclick='chooseSubject(${JSON.stringify(s)})'>${s}</button>
      `).join('')}
      <button class="chip ${state.subject==='__custom__'?'selected':''}" onclick='chooseSubject("__custom__")'>✏️ 내가 직접 쓸래요</button>
    </div>
    ${state.subject==='__custom__' ? `
      <div style="margin-top:14px;">
        <input type="text" maxlength="40" placeholder="예: 날개 달린 거북이" value="${state.customSubject.replace(/"/g,'&quot;')}"
          oninput="setState({customSubject:this.value})">
      </div>
    ` : ''}
    ${navHTML(!state.subject || (state.subject==='__custom__' && !state.customSubject.trim()))}
  `);
}
function chooseSubject(s){ setState({subject:s}); }

function renderColor(){
  return panel(`
    <div class="step-label">STEP 4 · 색깔 정하기</div>
    <h2>어떤 색이 어울릴까요?</h2>
    <p class="hint">최대 3개까지 고를 수 있어요. (${state.colors.length}/3)</p>
    <div class="chip-row">
      ${COLORS.map(c=>`
        <button class="chip ${state.colors.includes(c.name)?'selected':''}" onclick='toggleColor(${JSON.stringify(c.name)})'>
          <span class="swatch" style="background:${c.hex}"></span>${c.name}
        </button>
      `).join('')}
    </div>
    ${navHTML(state.colors.length===0)}
  `);
}
function toggleColor(name){
  let colors = state.colors.slice();
  if(colors.includes(name)) colors = colors.filter(c=>c!==name);
  else if(colors.length < 3) colors.push(name);
  setState({colors});
}

function renderShape(){
  return panel(`
    <div class="step-label">STEP 5 · 모양과 느낌</div>
    <h2>어떤 모양과 느낌으로 그릴까요?</h2>
    <p class="hint">하나만 골라보세요.</p>
    <div class="chip-row">
      ${SHAPES.map(s=>`
        <button class="chip ${state.shape===s?'selected':''}" onclick='setState({shape:${JSON.stringify(s)}})'>${s}</button>
      `).join('')}
    </div>
    ${navHTML(!state.shape)}
  `);
}

function renderMood(){
  return panel(`
    <div class="step-label">STEP 6 · 분위기</div>
    <h2>전체적인 분위기는 어떤가요?</h2>
    <p class="hint">하나만 골라보세요.</p>
    <div class="chip-row">
      ${MOODS.map(m=>`
        <button class="chip ${state.mood===m?'selected':''}" onclick='setState({mood:${JSON.stringify(m)}})'>${m}</button>
      `).join('')}
    </div>
    ${navHTML(!state.mood)}
  `);
}

function renderExtra(){
  return panel(`
    <div class="step-label">STEP 7 · 마지막 이야기 (선택)</div>
    <h2>더 넣고 싶은 이야기가 있나요?</h2>
    <p class="hint">없으면 그냥 다음으로 넘어가도 괜찮아요.</p>
    <textarea rows="3" maxlength="120" placeholder="예: 밤하늘에 별이 가득했으면 좋겠어요"
      oninput="setState({extra:this.value})">${state.extra}</textarea>
    ${navHTML(false, '프롬프트 완성하기 ✨')}
  `);
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderResult(){
  const prompt = buildPrompt();
  if(state.editedPrompt===null) state.editedPrompt = prompt;
  const isG5 = state.grade === '5';

  const g5Block = `
    <div class="result-block">
      <h3>완성된 프롬프트 <span class="tag">그대로 사용하기</span></h3>
      <div class="prompt-box">${formatPromptHTML(prompt)}</div>
      <div class="copy-row">
        <button class="btn primary" onclick="copyText(${JSON.stringify(prompt)}, 'copied-g5')">📋 캔바용 프롬프트 복사</button>
        <span class="copied-msg" id="copied-g5">✅ 복사 완료!</span>
      </div>
      <div class="tip">💡 복사한 문장을 캔바(Canva)의 AI 이미지 생성(매직 미디어)에 그대로 붙여넣어 보세요!</div>
    </div>
  `;

  const g6Block = `
    <div class="result-block">
      <h3>AI가 만든 프롬프트 <span class="tag">참고용</span></h3>
      <div class="prompt-box">${formatPromptHTML(prompt)}</div>
    </div>
    <div class="result-block">
      <h3>나만의 프롬프트로 바꿔보기 <span class="tag">✏️ 직접 수정</span></h3>
      <p class="hint" style="margin-bottom:10px;">문장을 자유롭게 고치거나 표현을 더해서 나만의 프롬프트를 완성해보세요.</p>
      <textarea rows="7" id="editArea" oninput="state.editedPrompt=this.value">${state.editedPrompt}</textarea>
      <div class="copy-row">
        <button class="btn primary" onclick="copyText(document.getElementById('editArea').value, 'copied-g6')">📋 나의 프롬프트 복사</button>
        <span class="copied-msg" id="copied-g6">✅ 복사 완료!</span>
      </div>
      <div class="tip">💡 색깔을 바꾸거나, 재미있는 표현을 더하거나, 문장을 내 말투로 바꿔보세요. 정답은 없어요!</div>
    </div>
  `;

  return panel(`
    <span class="badge-grade">${isG5?'5학년':'6학년'} 완성!</span>
    <h2>🎉 프롬프트가 완성되었어요</h2>
    <p class="hint">캔바(Canva)에 접속해서 AI 이미지 만들기에 붙여넣어 보세요.</p>
    ${isG5 ? g5Block : g6Block}
    <div class="tip tip-success">
      🌱 AI가 그려준 그림은 참고 자료예요. 완성된 그림에 내 생각과 이야기를 더해서 나만의 작품으로 만들어보세요. 그리고 다른 친구의 아이디어도 소중히 여겨주세요!
    </div>
    <div class="nav">
      <button class="btn ghost" onclick="goBack()">← 이전으로 돌아가서 수정</button>
      <button class="btn primary" onclick="goRestart()">🔄 처음부터 다시 만들기</button>
    </div>
  `);
}

function copyText(text, msgId){
  const done = ()=>{
    const el = document.getElementById(msgId);
    if(el){
      el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'), 1800);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  done();
}

function render(){
  renderProgress();
  const app = document.getElementById('app');
  switch(STEPS[state.step]){
    case 'grade': app.innerHTML = renderGrade(); break;
    case 'category': app.innerHTML = renderCategory(); break;
    case 'subject': app.innerHTML = renderSubject(); break;
    case 'color': app.innerHTML = renderColor(); break;
    case 'shape': app.innerHTML = renderShape(); break;
    case 'mood': app.innerHTML = renderMood(); break;
    case 'extra': app.innerHTML = renderExtra(); break;
    case 'result': app.innerHTML = renderResult(); break;
  }
}

render();
</script>
</body>
</html>
