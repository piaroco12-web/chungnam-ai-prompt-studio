<style>
/* Layout: navy stage with one bright working panel (from the Chungnam AI Image Studio repo), 6-step wizard after a language gate */
:root{
  --ink:#071a2b; --ink2:#0b3154; --blue:#0068b7; --green:#48a548; --orange:#f28c28; --gold:#c8a96a;
  --panel:#fafcfd; --card:#ffffff; --text:#14283a; --muted:#5b6d7c; --line:#dce4ea; --soft:#edf3f6; --ok:#0c7142;
  --sans:"Noto Sans","Noto Sans KR","Noto Sans Thai","Noto Sans Sinhala","Noto Sans Tamil","Noto Sans Thaana","Noto Naskh Arabic",system-ui,sans-serif;
  --shadow:0 22px 70px rgba(0,16,34,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{min-height:100vh;font-family:var(--sans);color:var(--text);background:radial-gradient(circle at 82% 6%,rgba(0,104,183,.34),transparent 34%),radial-gradient(circle at 10% 92%,rgba(72,165,72,.16),transparent 30%),linear-gradient(150deg,#061725,#0a2944 58%,var(--ink));-webkit-tap-highlight-color:transparent;padding-inline:16px;padding-block:20px 36px}
button,input,textarea,select{font:inherit}
.shell{width:min(1160px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;color:#fff;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.mark{flex:none;width:44px;height:44px;border-radius:13px;background:conic-gradient(from 220deg,var(--blue),var(--green),var(--orange),var(--blue));box-shadow:inset 0 0 0 5px rgba(255,255,255,.92)}
.brand b{display:block;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;color:#afc2d1;font-size:12.5px;margin-top:2px}
.langpick{display:flex;align-items:center;gap:8px;color:#b9cbd8;font-size:13px}
.langpick select{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;min-height:42px;max-width:230px}
.langpick select option{color:#14283a;background:#fff}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.75);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.progress-wrap{padding:20px 26px 0}
.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.progress{height:5px;background:#e5ebef;border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:9px;transition:width .35s ease}
.content{padding:clamp(22px,4.6vw,54px)}
.step{animation:rise .28s ease}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--blue);font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.title{font-size:clamp(26px,3.8vw,42px);line-height:1.25;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
.desc{font-size:clamp(15.5px,1.9vw,18px);line-height:1.65;color:var(--muted);margin:0 0 26px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{min-height:140px;text-align:start;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:#193246;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{transform:translateY(-2px);border-color:#91b8d3;box-shadow:0 12px 30px rgba(16,54,80,.1)}
.card:focus-visible,.action:focus-visible,.langpick select:focus-visible,.detail input:focus-visible{outline:3px solid rgba(0,104,183,.35);outline-offset:3px}
.card[aria-pressed="true"]{border:2px solid var(--blue);background:linear-gradient(145deg,#fff,#eef7fc);box-shadow:0 12px 32px rgba(0,104,183,.14)}
.card[aria-pressed="true"]::after{content:"✓";position:absolute;inset-inline-end:14px;top:14px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#edf5f9;color:var(--blue);font-size:20px;margin-bottom:8px}
.card h3{font-size:18px;line-height:1.35;margin:0;padding-inline-end:34px}
.card p{font-size:14px;line-height:1.55;color:var(--muted);margin:0}
.card .en{font-size:12px;color:#7c8d9a;letter-spacing:.01em;margin-top:auto;padding-top:6px;direction:ltr;text-align:start}
[dir="rtl"] .card .en{text-align:end}
.swatches{display:flex;gap:5px;margin:2px 0 8px}
.swatches i{width:26px;height:9px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}
.lang-card{min-height:112px}
.lang-card .native{font-size:22px;font-weight:800;line-height:1.3}
.lang-card .meta{font-size:12.5px;color:var(--muted);direction:ltr}
.subhead{margin:30px 0 12px;font-size:18px}
.detail{margin-top:24px;display:grid;gap:8px;max-width:640px}
.detail label{font-weight:700;font-size:15px}
.detail input{min-height:52px;border:1px solid #ccd9e1;border-radius:14px;padding:0 16px;background:#fff;color:var(--text);width:100%}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.action{border:0;border-radius:14px;min-height:56px;padding:0 24px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.back{background:#edf1f4;color:#415768}
.next{margin-inline-start:auto;background:linear-gradient(135deg,#075f9d,#0079c8);color:#fff;box-shadow:0 10px 24px rgba(0,104,183,.22)}
.next:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.pill{padding:7px 12px;border:1px solid #d6e1e8;border-radius:999px;background:#f5f8fa;color:#496071;font-size:13px}
.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.prompts.one{grid-template-columns:minmax(0,1fr)}
.pbox{display:grid;gap:10px;min-width:0}
.pbox h2{font-size:15px;margin:0;color:#164d6c;display:flex;align-items:center;gap:8px}
.pbox h2 .tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8a692d;background:#f4f1e8;border-radius:999px;padding:3px 8px}
.prompt{width:100%;min-height:320px;border:1px solid #ccd9e1;border-radius:16px;padding:18px;background:#fff;color:#1a3041;line-height:1.7;resize:vertical;font-size:14.5px}
.copyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.copy{background:var(--ok);color:#fff}
.canva{background:#fff;color:#0b4f86;border:1px solid #b9d3e6}
.toast{color:var(--ok);font-weight:700;font-size:14px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.note{margin-top:20px;padding:15px 17px;border-radius:13px;background:#f7f2e7;color:#705c35;font-size:14px;line-height:1.6;border:1px solid #eadcbd}
.trnote{margin:0 0 22px;padding:11px 14px;border-radius:12px;background:#eef6fb;color:#29587a;font-size:13.5px;line-height:1.55;border:1px solid #d3e6f2}
.footer{color:#95aabd;text-align:center;font-size:12px;margin-top:18px;line-height:1.6}
@media(max-width:900px){.grid.four{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.grid,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.prompts{grid-template-columns:minmax(0,1fr)}.card{min-height:124px;padding:16px}.progress-wrap{padding:18px 18px 0}.content{padding:24px 18px}}
@media(max-width:460px){.grid{grid-template-columns:minmax(0,1fr)}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.title{font-size:27px}.panel{border-radius:22px}.langpick select{max-width:180px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main class="shell">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>Global Leaders Prompt Studio</b><small>KNUE Global Education Leadership × Chungnam AI Image Studio</small></div></div>
    <label class="langpick" for="langSelect"><span id="langLabel">Language</span><select id="langSelect"></select></label>
  </header>
  <section class="panel" aria-live="polite">
    <div class="progress-wrap"><div class="progress-head"><span id="stepLabel"></span><span id="stepCount"></span></div><div class="progress"><i id="bar"></i></div></div>
    <div class="content" id="steps"></div>
  </section>
  <p class="footer">Chungnam Software Education Experience Center · KNUE Global Education Leadership visit · 16 October 2026</p>
</main>

 styles:[["Foto paịsta","Otu akara, ohere sara mbara, usoro doro anya"],["Foto akụkọ","Foto eke dị ka eziokwu"],["Agba mmiri ọgbara ọhụrụ","Agba mmiri dị nro na ahịrị ink dị gịrịgịrị"],["3D dị mfe","Ihe 3D na-adịghị egbuke egbuke n'ohere dị nro"]],

 moods:[["Ntụkwasị obi na nguzozi","Nwayọ, dị larịị ma kwụsie ike"],["Nghọta na omimi","Ìhè gbakọtara n'otu ụzọ, omimi dị jụụ"],["Njikọ na-ekpo ọkụ","Usoro dị nro, ịdị nso, ìhè dị nwayọ"],["Ọhụụ nwere obi ike","Ahịrị na-arị elu na mbara igwe meghere emeghe"]],
 uses:[["Iko","Isiokwu n'etiti (55%), ohere nchekwa 18% n'akụkụ"],["Mkpuchi akụkọ","Isiokwu n'ala (60%), elu 30% maka aha"],["Foto mmemme","Isiokwu n'aka nri (60%), aka ekpe 30% maka ozi"],["Kaadị mgbasa ozi ọha","Ụdị dị mfe nke a na-ahụ nke ọma na obere ihuenyo"]],
 tpl:["Ọnọdụ","Nhazi","Ìhè","Agba","Ụdị","Nsonaazụ","Hapụ ihe dị ka 30% nke foto ka ọ bụrụ ohere efu dị jụụ.","Ìhè ehihie dị nro si n'elu aka ekpe, onyinyo dị nro, omimi doro anya.","Foto nwere akụkụ anọ ha nhata. Enweghị mkpụrụedemede ma ọ bụ okwu n'ime foto. AR 1:1","Ihe sitere na mba m"]

<script>
"use strict";
const LANGS=[
 ["en","English","English","All participants"],["ko","한국어","Korean","Korea"],["fr","Français","French","Côte d’Ivoire · Rwanda"],["pt","Português","Portuguese","Timor-Leste"],["tet","Tetun","Tetum","Timor-Leste"],
 ["es","Español","Spanish","Colombia"],["mn","Монгол","Mongolian","Mongolia"],["dv","ދިވެހި","Dhivehi","Maldives"],["si","සිංහල","Sinhala","Sri Lanka"],["ta","தமிழ்","Tamil","Sri Lanka"],
 ["id","Bahasa Indonesia","Indonesian","Indonesia"],["uz","Oʻzbekcha","Uzbek","Uzbekistan"],["ur","اردو","Urdu","Pakistan"],["th","ไทย","Thai","Thailand"],["rw","Ikinyarwanda","Kinyarwanda","Rwanda"],
 ["tn","Setswana","Setswana","Botswana"],["sw","Kiswahili","Swahili","Uganda"],["ha","Hausa","Hausa","Nigeria"],["yo","Yorùbá","Yoruba","Nigeria"],["ig","Igbo","Igbo","Nigeria"]
];
const RTL=new Set(["ur","dv"]);
const ICONS={dirs:["◇","○","✦"],styles:["▣","◐","❍","◕"],uses:["☕","▤","✧","▢"]};
const HEX=[["#0068B7","#F4F7F8","#48A548","#F28C28"],["#071A2B","#0B3154","#C8A96A","#F4F1E8"],["#073B4C","#138A8A","#79C9B7","#F3F7F5"],["#5B4636","#E8C7A5","#C8895A","#F7F1E8"]];
const EN_SCENE=["An image that symbolizes the value of education and growth through learning","A scene about time shared in schools and the warmth of the people there","A vision of future education where people, places and technology connect"];

const S={lang:null,step:-1,dir:null,sub:null,style:null,pal:null,mood:null,use:null,detail:""};
try{const v=localStorage.getItem("glps-lang");if(v&&I18N[v])S.lang=v}catch(e){}

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const L=()=>I18N[S.lang||"en"];
const EN=I18N.en;
const ui=i=>L().ui[i]||EN.ui[i];
const lf=t=>t.charAt(0).toLocaleLowerCase(S.lang||"en")+t.slice(1);

function setLang(code){
  S.lang=code;
  try{localStorage.setItem("glps-lang",code)}catch(e){}
  document.documentElement.lang=code;
  document.documentElement.dir=RTL.has(code)?"rtl":"ltr";
  $("langSelect").value=code;
  $("langLabel").textContent=ui(29);
}

(function initSelect(){
  const sel=$("langSelect");
  sel.innerHTML=LANGS.map(l=>`<option value="${l[0]}">${esc(l[1])}${l[1]!==l[2]?" · "+esc(l[2]):""}</option>`).join("");
  sel.addEventListener("change",()=>{setLang(sel.value);if(S.step<0)S.step=0;render()});
})();

function card(group,i,title,desc,enTitle,extra=""){
  const pressed=S[group]===i;
  const icon=ICONS[group+"s"]?`<span class="icon" aria-hidden="true">${ICONS[group+"s"][i]}</span>`:"";
  const en=(S.lang&&S.lang!=="en"&&enTitle)?`<span class="en">${esc(enTitle)}</span>`:"";
  return `<button type="button" class="card" data-group="${group}" data-i="${i}" aria-pressed="${pressed}">${icon}${extra}<h3>${esc(title)}</h3><p>${esc(desc)}</p>${en}</button>`;
}
function ready(){return [S.dir!==null,S.sub!==null,S.style!==null,S.pal!==null&&S.mood!==null,S.use!==null,true][S.step]}
function nav(back=true,next=true,label){
  return `<div class="nav">${back?`<button type="button" class="action back" data-nav="-1">${esc(ui(17))}</button>`:"<span></span>"}${next?`<button type="button" class="action next" data-nav="1" ${ready()?"":"disabled"}>${esc(label||ui(18))}</button>`:""}</div>`;
}
function head(eyebrow,h,d){return `<span class="eyebrow">${eyebrow}</span><h1 class="title">${esc(h)}</h1><p class="desc">${esc(d)}</p>`}
function trNote(){const n=L().ui[27];return n?`<p class="trnote">${esc(n)}</p>`:""}

function render(){
  const labels=ui(28).split("|");
  if(S.step<0){
    $("bar").style.width="0%";$("stepLabel").textContent="Language · 언어 · Langue · Idioma";$("stepCount").textContent="";
    $("steps").innerHTML=`<div class="step"><span class="eyebrow">Welcome · 환영합니다</span><h1 class="title">Choose your language</h1><p class="desc">You can change it anytime at the top. Every choice also shows the English name, and the final prompt comes in your language and in English.</p><div class="grid four">${LANGS.map(l=>`<button type="button" class="card lang-card" data-lang="${l[0]}" aria-pressed="${S.lang===l[0]}"><span class="native" dir="${RTL.has(l[0])?"rtl":"ltr"}">${esc(l[1])}</span><span class="meta">${esc(l[2])} · ${esc(l[3])}</span></button>`).join("")}</div></div>`;
    bind();return;
  }
  $("bar").style.width=`${(S.step+1)/6*100}%`;
  $("stepLabel").textContent=`STEP ${S.step+1} · ${labels[S.step]||""}`;
  $("stepCount").textContent=`${S.step+1} / 6`;
  const T=L();let h="";
  if(S.step===0){
    h=`${trNote()}${head("Perspective",ui(2),ui(3))}<div class="grid">${T.dirs.map((x,i)=>card("dir",i,x[0],x[1],EN.dirs[i][0])).join("")}</div>${nav(true)}`;
  }else if(S.step===1){
    const base=S.dir*4;
    h=`${head("Subject",ui(4),ui(5))}<div class="grid four">${[0,1,2,3].map(k=>card("sub",base+k,T.subs[base+k][0],T.subs[base+k][1],EN.subs[base+k][0])).join("")}</div>
       <div class="detail"><label for="detail">${esc(ui(15))}</label><input id="detail" type="text" maxlength="120" placeholder="${esc(ui(16))}" value="${esc(S.detail)}"></div>${nav()}`;
  }else if(S.step===2){
    h=`${head("Visual language",ui(6),ui(7))}<div class="grid four">${T.styles.map((x,i)=>card("style",i,x[0],x[1],EN.styles[i][0])).join("")}</div>${nav()}`;
  }else if(S.step===3){
    h=`${head("Color & tone",ui(8),ui(10))}<div class="grid four">${T.pals.map((x,i)=>card("pal",i,x[0],x[1],EN.pals[i][0],`<span class="swatches" aria-hidden="true">${HEX[i].map(c=>`<i style="background:${c}"></i>`).join("")}</span>`)).join("")}</div>
       <h2 class="subhead">${esc(ui(9))}</h2><div class="grid four">${T.moods.map((x,i)=>card("mood",i,x[0],x[1],EN.moods[i][0])).join("")}</div>${nav()}`;
  }else if(S.step===4){
    h=`${head("Output",ui(11),ui(12))}<div class="grid four">${T.uses.map((x,i)=>card("use",i,x[0],x[1],EN.uses[i][0])).join("")}</div>${nav(true,true,ui(19))}`;
  }else{
    const local=S.lang&&S.lang!=="en";
    const pills=[T.dirs[S.dir][0],T.subs[S.sub][0],T.styles[S.style][0],T.pals[S.pal][0],T.moods[S.mood][0],T.uses[S.use][0]];
    h=`${head("Compiled prompt",ui(13),ui(14))}<div class="summary">${pills.map(p=>`<span class="pill">${esc(p)}</span>`).join("")}</div>
      <div class="prompts ${local?"":"one"}">
        ${local?`<div class="pbox"><h2>${esc(ui(20))}</h2><textarea class="prompt" id="pLocal" dir="${RTL.has(S.lang)?"rtl":"ltr"}" aria-label="${esc(ui(20))}">${esc(buildLocal())}</textarea><div class="copyrow"><button type="button" class="action copy" data-copy="pLocal">${esc(ui(22))}</button><span class="toast" id="t-pLocal">${esc(ui(23))}</span></div></div>`:""}
        <div class="pbox"><h2>${esc(ui(21))} <span class="tag">Canva</span></h2><textarea class="prompt" id="pEn" dir="ltr" aria-label="English prompt">${esc(buildEnglish())}</textarea><div class="copyrow"><button type="button" class="action copy" data-copy="pEn">${esc(ui(22))}</button><a class="action canva" href="https://www.canva.com/" target="_blank" rel="noopener">${esc(ui(24))} ↗</a><span class="toast" id="t-pEn">${esc(ui(23))}</span></div></div>
      </div>
      <div class="note">${esc(ui(26))}</div>
      <div class="nav"><button type="button" class="action back" data-nav="-1">${esc(ui(17))}</button><button type="button" class="action back" id="restart">${esc(ui(25))}</button></div>`;
  }
  $("steps").innerHTML=`<div class="step">${h}</div>`;
  bind();
}

function buildLocal(){
  const T=L(),t=T.tpl,end=S.lang==="th"?" ":(S.lang==="ur"?"۔ ":". ");
  const det=S.detail.trim()?` ${t[9]}: ${S.detail.trim()}${end.trim()}`:"";
  return `${t[0]}: ${T.dirs[S.dir][1]}${end}${T.subs[S.sub][1]}${end.trim()}${det}

${t[1]}: ${T.uses[S.use][1]}${end}${T.moods[S.mood][0]}, ${lf(T.moods[S.mood][1])}${end}${t[6]}

${t[2]}: ${t[7]}

${t[3]}: ${T.pals[S.pal][1]}${end}HEX ${HEX[S.pal].join(", ")}

${t[4]}: ${T.styles[S.style][0]}, ${lf(T.styles[S.style][1])}${end.trim()}

${t[5]}: ${t[8]}`;
}
function buildEnglish(){
  const d=S.detail.trim(),lang=LANGS.find(l=>l[0]===S.lang);
  const det=d?` Include this detail from the creator's own country${S.lang&&S.lang!=="en"?` (written in ${lang[2]})`:""}: ${d}.`:"";
  return `Scene: ${EN_SCENE[S.dir]}. ${EN.subs[S.sub][1]}.${det} One symbol carries the message; surrounding elements stay simple and low in contrast. The scene feels respectful of public education, people-centred technology and shared global learning.

Composition: ${EN.uses[S.use][1]}. Mood: ${EN.moods[S.mood][0].toLowerCase()}, ${EN.moods[S.mood][1].toLowerCase()}. Build a three-level hierarchy (main, supporting, background) and leave about 30% of the square as calm empty space.

Lighting: Soft 4300K daylight from the upper left, a faint cool fill from the opposite side, key-to-fill about 1:2.5, soft shadow edges and clear spatial depth.

Color grading: ${EN.pals[S.pal][1]}. Palette ${HEX[S.pal].join(", ")}. Medium-low saturation throughout; gold or orange only as small accents.

Texture/Medium: ${EN.styles[S.style][0]}, ${EN.styles[S.style][1].toLowerCase()}. Surfaces react to light naturally with a calm, finished look.

Output: Square image for Canva Magic Media. A pure visual with no letters, logos or words; titles and names are added later in Canva. AR 1:1`;
}

function bind(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{setLang(b.dataset.lang);S.step=0;render();scrollTo({top:0,behavior:"smooth"})});
  document.querySelectorAll(".card[data-group]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.group,i=+b.dataset.i;S[g]=i;
    if(g==="dir"){S.sub=null}
    if(g==="pal"&&S.mood===null)S.mood=0;
    render();
  });
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{S.step+=+b.dataset.nav;render();scrollTo({top:0,behavior:"smooth"})});
  const det=$("detail");if(det)det.addEventListener("input",()=>{S.detail=det.value});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const ta=$(b.dataset.copy),toast=$("t-"+b.dataset.copy);
    const done=()=>{toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)};
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();try{document.execCommand("copy")}catch(e){}done()})}catch(e){ta.select();try{document.execCommand("copy")}catch(e2){}done()}
  });
  const r=$("restart");if(r)r.onclick=()=>{Object.assign(S,{step:0,dir:null,sub:null,style:null,pal:null,mood:null,use:null,detail:""});render();scrollTo({top:0,behavior:"smooth"})};
}

if(S.lang){setLang(S.lang);}else{$("langSelect").value="en";}
render();
</script>
