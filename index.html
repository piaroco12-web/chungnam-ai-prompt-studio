<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a2b">
  <title>충남교육 AI 이미지 스튜디오</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root{--ink:#071a2b;--blue:#0068b7;--green:#48a548;--orange:#f28c28;--gold:#c8a96a;--paper:#f7f8fa;--muted:#637383;--line:#dce4ea;--white:#fff;--shadow:0 22px 70px rgba(0,16,34,.18)}
    *{box-sizing:border-box}html{background:var(--ink)}body{margin:0;min-height:100vh;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#14283a;background:radial-gradient(circle at 82% 8%,rgba(0,104,183,.32),transparent 33%),radial-gradient(circle at 12% 88%,rgba(72,165,72,.16),transparent 30%),linear-gradient(145deg,#061725,#0a2944 58%,#071a2b);-webkit-tap-highlight-color:transparent}
    button,textarea{font:inherit}.shell{width:min(1180px,100%);min-height:100vh;margin:auto;padding:24px clamp(16px,3vw,42px) 40px}.topbar{display:flex;align-items:center;justify-content:space-between;color:white;margin-bottom:24px}.brand{display:flex;align-items:center;gap:13px}.mark{width:44px;height:44px;border-radius:13px;background:conic-gradient(from 220deg,var(--blue),var(--green),var(--orange),var(--blue));position:relative;box-shadow:inset 0 0 0 5px rgba(255,255,255,.9)}.brand b{font-size:18px;letter-spacing:-.02em}.brand small{display:block;color:#afc2d1;margin-top:3px}.secure{font-size:13px;color:#b9cbd8;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px}.panel{background:rgba(250,252,253,.97);border:1px solid rgba(255,255,255,.75);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.progress-wrap{padding:22px 26px 0}.progress-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}.progress{height:5px;background:#e5ebef;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:16.66%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:9px;transition:width .35s ease}.content{padding:clamp(26px,5vw,58px)}.step{display:none;animation:rise .28s ease}.step.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{font-size:clamp(28px,4vw,46px);line-height:1.15;letter-spacing:-.045em;margin:10px 0 12px}.desc{font-size:clamp(16px,2vw,19px);line-height:1.65;color:var(--muted);margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:152px;text-align:left;padding:22px;border:1px solid var(--line);border-radius:18px;background:white;color:#193246;cursor:pointer;transition:.18s ease;position:relative}.card:hover{transform:translateY(-2px);border-color:#91b8d3;box-shadow:0 12px 30px rgba(16,54,80,.1)}.card:focus-visible,.action:focus-visible{outline:3px solid rgba(0,104,183,.28);outline-offset:3px}.card.selected{border:2px solid var(--blue);background:linear-gradient(145deg,#fff,#eef7fc);box-shadow:0 12px 32px rgba(0,104,183,.14)}.card.selected:after{content:'✓';position:absolute;right:14px;top:14px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:white;font-weight:800}.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#edf5f9;color:var(--blue);font-size:21px;margin-bottom:18px}.card h3{font-size:19px;margin:0 36px 7px 0}.card p{font-size:14px;line-height:1.55;color:var(--muted);margin:0}.swatches{display:flex;gap:5px;margin:4px 0 14px}.swatches i{width:26px;height:9px;border-radius:6px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.action{border:0;border-radius:14px;min-height:58px;padding:0 24px;font-weight:750;cursor:pointer}.back{background:#edf1f4;color:#415768}.next{margin-left:auto;background:linear-gradient(135deg,#075f9d,#0079c8);color:white;box-shadow:0 10px 24px rgba(0,104,183,.22)}.next:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}.summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}.pill{padding:8px 12px;border:1px solid #d6e1e8;border-radius:999px;background:#f5f8fa;color:#496071;font-size:13px}.assembly{display:grid;grid-template-columns:210px 1fr;gap:22px}.pipeline{display:flex;flex-direction:column;gap:8px}.node{padding:12px 14px;border-radius:12px;background:#edf3f6;color:#607482;font-size:13px;border-left:3px solid #a8bac6}.node.done{background:#eaf5f9;color:#164d6c;border-color:var(--blue)}.prompt{width:100%;min-height:335px;border:1px solid #ccd9e1;border-radius:16px;padding:20px;background:#fff;color:#1a3041;line-height:1.7;resize:vertical;user-select:text}.copyrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:15px}.copy{background:#0c7142;color:#fff}.reset{background:#edf1f4;color:#415768}.toast{color:#0c7142;font-weight:700;font-size:14px;opacity:0;transition:.2s}.toast.show{opacity:1}.note{margin-top:18px;padding:15px 17px;border-radius:13px;background:#f7f2e7;color:#705c35;font-size:14px;line-height:1.55;border:1px solid #eadcbd}.footer{color:#95aabd;text-align:center;font-size:12px;margin-top:18px}.usage-card .icon{background:#f4f1e8;color:#8a692d}
    @media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.card{min-height:132px;padding:18px}.assembly{grid-template-columns:1fr}.pipeline{display:grid;grid-template-columns:repeat(3,1fr)}.node{border-left:0;border-top:3px solid #a8bac6}.secure{display:none}.content{padding:26px 18px}.progress-wrap{padding:18px 18px 0}}
    @media(max-width:480px){.grid{grid-template-columns:1fr}.card{min-height:110px}.pipeline{grid-template-columns:1fr 1fr}.title{font-size:30px}.shell{padding:14px 10px 28px}.panel{border-radius:22px}}
    @media(orientation:landscape) and (max-height:700px){.shell{padding-top:12px}.topbar{margin-bottom:12px}.content{padding-top:24px}.card{min-height:125px}.title{font-size:32px}.desc{margin-bottom:18px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"></span><div><b>충남교육 AI 이미지 스튜디오</b><small>Education × AI Visual Lab</small></div></div><span class="secure">정사각형 · 무문자 이미지</span></header>
  <section class="panel" aria-live="polite">
    <div class="progress-wrap"><div class="progress-head"><span id="stepLabel">STEP 1 · 방향</span><span id="stepCount">1 / 6</span></div><div class="progress"><i id="bar"></i></div></div>
    <div class="content" id="steps"></div>
  </section>
  <p class="footer">CHUNGNAM EDUCATION · 사람과 교육의 가치를 중심에 둔 AI 창작 경험</p>
</main>
<script>
const DATA={
 direction:[
  {id:'value',icon:'◇',title:'교육의 가치',desc:'배움·성장·신뢰를 상징하는 절제된 정책 이미지',scene:'교육의 가치와 배움의 성장을 상징하는 하나의 중심 오브제',subjects:[['book','책과 새싹','펼친 책 사이에서 곧게 자라는 푸른 새싹, 지식이 성장으로 이어지는 순간'],['path','배움의 길','완만하게 이어지는 길과 멀리 떠오르는 빛, 지속적인 성장의 여정'],['tree','함께 자라는 나무','서로 연결된 뿌리 위로 균형 있게 자라는 한 그루 나무, 협력과 신뢰'],['seal','책임과 신뢰','단정한 인장과 얇게 펼쳐진 종이, 공공의 책임과 약속']]},
  {id:'journey',icon:'○',title:'함께한 여정',desc:'교육 현장의 기억과 사람의 온기를 담은 에디토리얼 이미지',scene:'교육 현장에서 함께한 시간과 사람의 온기를 상징하는 장면',subjects:[['school','첫 학교의 교정','오래된 교정과 햇빛이 드는 나무 한 그루, 첫 발령의 설렘'],['letter','제자의 손편지','정갈한 책상 위 손편지와 작은 들꽃, 감사가 오래 남는 순간'],['alley','고향의 골목','낮은 담장과 완만한 골목길, 공동체의 기억이 머무는 풍경'],['library','조용한 서재','창가의 책과 나무 책상, 축적된 경험과 다음 배움을 준비하는 시간']]},
  {id:'future',icon:'✦',title:'미래교육 비전',desc:'사람·지역·기술의 연결을 보여주는 미래지향적 키비주얼',scene:'사람과 지역과 기술이 유기적으로 연결되는 미래교육의 비전',subjects:[['bridge','연결의 다리','두 공간을 부드럽게 잇는 빛의 다리, 기술과 사람의 연결'],['network','교육 협력망','충남의 지형을 닮은 유기적 네트워크와 밝게 이어진 노드'],['gear','기술과 새싹','정교한 원형 구조 안에서 자라는 새싹, 기술이 성장을 돕는 관계'],['horizon','서해의 미래','서해 수평선 위로 번지는 빛과 얇은 데이터 곡선, 지역에서 시작하는 미래']]}
 ],
 style:[['keyart','정책 키비주얼','단일 상징 오브제를 중심으로 한 정책 포럼 키비주얼, 넓은 여백과 명확한 위계'],['editorial','에디토리얼 사진','절제된 다큐멘터리 에디토리얼 사진, 자연스러운 깊이와 현실적인 표면'],['wash','현대 수채화','번짐을 통제한 현대 수채화와 얇은 먹선, 종이의 결이 느껴지는 표현'],['3d','미니멀 3D','매트한 재질의 미니멀 3D 오브제, 정교한 모서리와 부드러운 공간감']],
 palette:[
  ['official','충남교육 시그니처',['#0068B7','#48A548','#F28C28','#F4F7F8'],'블루 60%, 백색 30%, 그린과 오렌지 10%'],
  ['navy','정책 포럼 네이비',['#071A2B','#0B3154','#C8A96A','#F4F1E8'],'딥 네이비 60%, 블루 30%, 브라스 골드 10%'],
  ['jade','미래교육 청록',['#073B4C','#138A8A','#79C9B7','#F3F7F5'],'딥 틸 60%, 청록 30%, 밝은 민트 10%'],
  ['warm','함께한 시간',['#5B4636','#C8895A','#E8C7A5','#F7F1E8'],'브라운 60%, 미색 30%, 살구빛 10%']
 ],
 mood:[['trust','신뢰와 균형','정돈된 수평 구조, 안정적인 무게중심, 차분한 호흡'],['insight','통찰과 깊이','한 방향으로 모이는 빛, 깊은 명암 단계, 사색적인 정적'],['warmth','따뜻한 연결','부드러운 곡선과 가까운 거리감, 온화한 빛의 확산'],['progress','진취적 비전','완만한 상승선과 열린 수평선, 앞으로 이어지는 시선']],
 usage:[['mug','머그컵','중심 오브제를 중앙 55% 안에 배치하고 가장자리 18%를 안전 여백으로 유지'],['report','정책자료 표지','중심 오브제를 하단 60%에 배치하고 상단 30%를 캔바 제목 입력 공간으로 확보'],['event','행사 키비주얼','중심 오브제를 우측 60%에 배치하고 좌측 30%를 행사 정보 공간으로 확보'],['social','SNS 카드','작은 화면에서도 읽히는 단순한 실루엣과 3단 이하의 시각 위계']]
};
const state={step:0,direction:null,subject:null,style:null,palette:null,mood:null,usage:null};
const labels=['방향','소재','표현 방식','색과 분위기','활용처','완성'];
const steps=document.querySelector('#steps');
function card(o,group,selected,extra=''){return `<button class="card ${selected?'selected':''} ${group==='usage'?'usage-card':''}" data-group="${group}" data-id="${o.id}" aria-pressed="${selected}">${o.icon?`<span class="icon">${o.icon}</span>`:''}${extra}<h3>${o.title}</h3><p>${o.desc}</p></button>`}
function nav(back=true,next=true,nextText='다음 단계'){return `<div class="nav">${back?'<button class="action back" data-nav="back">이전</button>':'<span></span>'}${next?`<button class="action next" data-nav="next" ${ready()?'':'disabled'}>${nextText}</button>`:''}</div>`}
function ready(){return [state.direction,state.subject,state.style,state.palette&&state.mood,state.usage,true][state.step]}
function find(list,id){return list.find(x=>x.id===id)}
function render(){
 document.querySelector('#bar').style.width=`${(state.step+1)/6*100}%`;document.querySelector('#stepLabel').textContent=`STEP ${state.step+1} · ${labels[state.step]}`;document.querySelector('#stepCount').textContent=`${state.step+1} / 6`;
 let h='';
 if(state.step===0){h=`<div class="step active"><span class="eyebrow">Perspective</span><h1 class="title">어떤 이야기를 시각화할까요?</h1><p class="desc">정책과 교육 현장의 언어를 AI가 이해하는 이미지 방향으로 바꿉니다.</p><div class="grid">${DATA.direction.map(x=>card(x,'direction',state.direction===x.id)).join('')}</div>${nav(false)}</div>`}
 if(state.step===1){let d=find(DATA.direction,state.direction);h=`<div class="step active"><span class="eyebrow">Subject</span><h1 class="title">중심 소재를 선택해주세요</h1><p class="desc">한 장면에 하나의 상징을 두어 메시지를 명료하게 전달합니다.</p><div class="grid">${d.subjects.map(x=>card({id:x[0],title:x[1],desc:x[2]},'subject',state.subject===x[0])).join('')}</div>${nav()}</div>`}
 if(state.step===2){h=`<div class="step active"><span class="eyebrow">Visual language</span><h1 class="title">표현 방식을 결정합니다</h1><p class="desc">막연한 화풍 대신 표면, 깊이, 여백이 어떻게 보일지 구체적으로 선택합니다.</p><div class="grid">${DATA.style.map(x=>card({id:x[0],title:x[1],desc:x[2]},'style',state.style===x[0])).join('')}</div>${nav()}</div>`}
 if(state.step===3){h=`<div class="step active"><span class="eyebrow">Color & tone</span><h1 class="title">색과 분위기를 조율합니다</h1><p class="desc">HEX 팔레트와 감정의 구조가 프롬프트에 함께 반영됩니다.</p><div class="grid">${DATA.palette.map(x=>card({id:x[0],title:x[1],desc:x[3]},'palette',state.palette===x[0],`<span class="swatches">${x[2].map(c=>`<i style="background:${c}"></i>`).join('')}</span>`)).join('')}</div><h2 style="margin:28px 0 12px;font-size:18px">분위기</h2><div class="grid">${DATA.mood.map(x=>card({id:x[0],title:x[1],desc:x[2]},'mood',state.mood===x[0])).join('')}</div>${nav()}</div>`}
 if(state.step===4){h=`<div class="step active"><span class="eyebrow">Output</span><h1 class="title">어디에 활용할까요?</h1><p class="desc">정사각형 캔버스 안에서 용도별 안전 여백과 중심 위치를 자동 조정합니다.</p><div class="grid">${DATA.usage.map(x=>card({id:x[0],title:x[1],desc:x[2]},'usage',state.usage===x[0])).join('')}</div>${nav(true,true,'프롬프트 완성하기')}</div>`}
 if(state.step===5){let p=buildPrompt(),names=selections();h=`<div class="step active"><span class="eyebrow">Compiled prompt</span><h1 class="title">캔바용 프롬프트가 완성되었습니다</h1><p class="desc">선택한 요소가 장면부터 출력 규격까지 차례로 조립되었습니다.</p><div class="summary">${names.map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="assembly"><div class="pipeline">${['장면·상징','구도·여백','빛·깊이','HEX 색상','질감·매체','활용처·비율'].map(x=>`<div class="node done">✓ ${x}</div>`).join('')}</div><div><textarea class="prompt" id="prompt">${p}</textarea><div class="copyrow"><button class="action copy" id="copy">캔바용 프롬프트 복사</button><button class="action reset" id="reset">처음부터 다시</button><span class="toast" id="toast">복사되었습니다</span></div><div class="note">캔바의 앱 → Magic Media → 이미지에서 이 문장을 붙여 넣으세요. 이미지에는 글자를 생성하지 않고, 기관명과 제목은 캔바 텍스트 기능으로 정확하게 추가하는 구성입니다.</div></div></div>${nav(true,false)}</div>`}
 steps.innerHTML=h;bind();
}
function selections(){let d=find(DATA.direction,state.direction),s=d.subjects.find(x=>x[0]===state.subject),st=DATA.style.find(x=>x[0]===state.style),pa=DATA.palette.find(x=>x[0]===state.palette),mo=DATA.mood.find(x=>x[0]===state.mood),u=DATA.usage.find(x=>x[0]===state.usage);return[d.title,s[1],st[1],pa[1],mo[1],u[1]]}
function buildPrompt(){let d=find(DATA.direction,state.direction),s=d.subjects.find(x=>x[0]===state.subject),st=DATA.style.find(x=>x[0]===state.style),pa=DATA.palette.find(x=>x[0]===state.palette),mo=DATA.mood.find(x=>x[0]===state.mood),u=DATA.usage.find(x=>x[0]===state.usage);return `Scene: ${d.scene}. ${s[2]}. 상징물 하나가 메시지의 중심이 되고 주변 요소는 낮은 대비의 단정한 형태로 정리된다. 공공교육의 신뢰, 사람 중심의 기술, 충남 지역의 차분한 정체성이 함께 느껴지는 장면.\n\nComposition: ${u[2]}. ${mo[2]}. 정사각형 화면에 중심·보조·배경의 3단 시각 위계를 만들고 전체 면적의 약 30%를 고요한 여백으로 둔다.\n\nLighting: 좌측 상단에서 들어오는 4300K의 부드러운 주광, 반대편에는 약한 푸른 반사광, key:fill 1:2.5. 그림자 경계는 부드럽고 오브제의 윤곽과 공간 깊이가 또렷하게 구분된다.\n\nColor grading: ${pa[3]}. 팔레트 ${pa[2].join(', ')}. 채도는 중저채도로 통일하고 골드 또는 오렌지는 작은 강조점에만 사용한다.\n\nTexture/Medium: ${st[2]}. 표면의 재질과 빛의 반응이 자연스럽고, 정책 포럼의 무대 화면과 교육행정 홍보물에 어울리는 절제된 마감.\n\nOutput: 캔바 Magic Media용 정사각형 이미지. 이미지 자체는 순수한 비주얼로 완성하고, 제목과 기관명은 생성 후 캔바의 별도 텍스트 영역에 배치할 수 있도록 지정된 여백을 유지한다. AR 1:1`}
function bind(){document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{let g=el.dataset.group,id=el.dataset.id;state[g]=id;if(g==='palette'&&!state.mood)state.mood='trust';render()});document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{state.step+=el.dataset.nav==='next'?1:-1;render();scrollTo({top:0,behavior:'smooth'})});let copy=document.querySelector('#copy');if(copy)copy.onclick=async()=>{let p=document.querySelector('#prompt');try{await navigator.clipboard.writeText(p.value)}catch(e){p.select();document.execCommand('copy')}document.querySelector('#toast').classList.add('show')};let reset=document.querySelector('#reset');if(reset)reset.onclick=()=>{Object.assign(state,{step:0,direction:null,subject:null,style:null,palette:null,mood:null,usage:null});render()}}
render();
</script>
